# Публикация приложения на GitHub Pages.
# Сборки нет: в Pages уходит содержимое репозитория как есть.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные публикации не нужны: важна последняя версия, но начатую не прерываем
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Jekyll на Pages по умолчанию пропускает файлы, начинающиеся с подчёркивания
      - name: Отключить обработку Jekyll
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - name: Проверить манифест и синтаксис service worker
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node --check sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
