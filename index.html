<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Интенсивное наблюдение — отклонения и интерпретация</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#1D5DA6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1521">
<meta name="description" content="Мониторинг тяжёлых пациентов: отклонения от нормы, шкалы тяжести и интерпретация">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Наблюдение">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F7; --sheet:#FFFFFF; --ink:#152238; --ink-2:#4F5E77; --ink-3:#8491A6;
  --grid:#DAE3EA; --grid-2:#EAF0F4; --blue:#1D5DA6; --blue-soft:#E3EDF8;
  --band:#E1F2E7; --band-line:#96CCAA;
  --red:#BF2D28; --red-soft:#FCE6E4; --amber:#9E6200; --amber-soft:#FFF1D6; --green:#2A8C57;
  --focus:#1D5DA6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1521; --sheet:#162030; --ink:#E5EBF3; --ink-2:#A8B5C7; --ink-3:#738298;
    --grid:#293649; --grid-2:#1F2B3C; --blue:#74AAEA; --blue-soft:#1C2F4D;
    --band:#16332A; --band-line:#3C7A5A;
    --red:#F17B73; --red-soft:#3B1F1F; --amber:#E6AE45; --amber-soft:#35290F; --green:#5CC28A;
    --focus:#74AAEA;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1521; --sheet:#162030; --ink:#E5EBF3; --ink-2:#A8B5C7; --ink-3:#738298;
  --grid:#293649; --grid-2:#1F2B3C; --blue:#74AAEA; --blue-soft:#1C2F4D;
  --band:#16332A; --band-line:#3C7A5A;
  --red:#F17B73; --red-soft:#3B1F1F; --amber:#E6AE45; --amber-soft:#35290F; --green:#5CC28A;
  --focus:#74AAEA;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

.top{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--grid);background:var(--sheet)}
.brand{margin-right:auto;display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:13px}
.mode{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.live{background:var(--green)}.dot.local{background:var(--amber)}

.btn{border:1px solid var(--grid);background:var(--sheet);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#0E1521}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1521}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--grid-2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}

.app{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 55px)}
aside{border-right:1px solid var(--grid);background:var(--sheet);display:flex;flex-direction:column;min-width:0}
.side-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;padding:8px 12px;border:1px solid var(--grid);border-radius:8px;background:var(--paper)}
.plist{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1}
.pitem{width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;border-left:3px solid transparent}
.pitem:hover{background:var(--grid-2)}
.pitem[aria-current="true"]{background:var(--blue-soft)}
.pitem.crit{border-left-color:var(--red)} .pitem.warn{border-left-color:var(--amber)}
.pitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .sub{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news{grid-row:1/3;min-width:38px;text-align:center;border-radius:8px;padding:4px 0;font-weight:700;font-size:16px;line-height:1.1;background:var(--grid-2);color:var(--ink-2)}
.news small{display:block;font-size:9.5px;font-weight:500;letter-spacing:.02em}
.news.high{background:var(--red);color:#fff}.news.medium{background:var(--amber-soft);color:var(--amber)}.news.low{background:var(--blue-soft);color:var(--blue)}
.side-empty{padding:12px 16px;color:var(--ink-2);font-size:14px}

main{min-width:0;padding:22px 28px 60px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;padding-bottom:14px}
.phead h1{font-size:25px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.015em}
.phead .meta{color:var(--ink-2);font-size:14px;margin-top:3px}
.phead .acts{margin-left:auto;display:flex;gap:6px}
.back{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:18px}
.tab{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--blue)}
.tab .cnt{font-size:12px;font-weight:600;border-radius:10px;padding:0 7px;margin-left:5px;background:var(--red);color:#fff}

/* сводка */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.tile{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:10px 14px;border-top:3px solid var(--grid)}
.tile.crit{border-top-color:var(--red)}.tile.warn{border-top-color:var(--amber)}.tile.ok{border-top-color:var(--green)}
.tile .tl{font-size:13px;color:var(--ink-2)}
.tile .tv{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.tile.crit .tv{color:var(--red)}.tile.warn .tv{color:var(--amber)}
.tile .ts{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.stamp{font-size:13.5px;color:var(--ink-2);margin:4px 0 18px}
.stamp.old{color:var(--amber)}
h3.sec{font-size:17px;margin:22px 0 10px;font-weight:600}
.alert{background:var(--sheet);border:1px solid var(--grid);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.alert.crit{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-soft),var(--sheet) 40%)}
.alert.warn{border-left-color:var(--amber)}
.alert .ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.alert .lvl{font-size:12.5px;font-weight:600;color:var(--blue)}
.alert.crit .lvl{color:var(--red)}.alert.warn .lvl{color:var(--amber)}
.alert b{font-weight:600}
.alert p{margin:4px 0 0;color:var(--ink-2);font-size:14px;max-width:80ch}
.new{font-size:12px;font-weight:600;background:var(--blue);color:var(--sheet);border-radius:10px;padding:0 8px}
.vlist{background:var(--sheet);border:1px solid var(--grid);border-left:4px solid var(--amber);border-radius:8px;padding:8px 14px;margin-bottom:8px}
.vlh{font-size:12.5px;color:var(--amber);font-weight:600;margin-bottom:4px}
.vlist details{border-top:1px solid var(--grid-2);padding:6px 0}
.vlist details:first-of-type{border-top:0}
.vlist summary{cursor:pointer;font-weight:500}
.vlist details p{margin:4px 0 2px 18px;color:var(--ink-2);font-size:14px;max-width:80ch}
.minor{font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--grid-2);padding-top:6px;margin-top:2px}
.okbox{background:var(--sheet);border:1px solid var(--grid);border-left:4px solid var(--green);border-radius:8px;padding:10px 14px;color:var(--ink-2)}
.toast{border-radius:8px;padding:10px 14px;margin-bottom:14px;background:var(--blue-soft);font-size:14.5px}
.toast.crit{background:var(--red-soft)}

.ai{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:16px 20px}
.ai .aibar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ai .aibar .grow{flex:1}
.ai .aimeta{font-size:13px;color:var(--ink-3)}
.ai .stale{color:var(--amber);font-size:13.5px}
.aitext{margin-top:12px;max-width:80ch;font-size:15px}
.aitext h4{font-size:15.5px;margin:16px 0 4px}
.aitext h4:first-child{margin-top:4px}
.aitext p{margin:6px 0}
.aitext ul,.aitext ol{margin:6px 0;padding-left:22px}
.aitext li{margin:3px 0}
.thinking{color:var(--ink-3);font-style:italic}
.disc{font-size:12.5px;color:var(--ink-3);margin-top:12px}

/* динамика */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--blue-soft);color:var(--ink);font-weight:600}
.group{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;margin-bottom:16px;overflow:hidden}
.group h2{font-size:15px;font-weight:600;margin:0;padding:11px 16px;border-bottom:1px solid var(--grid);background:repeating-linear-gradient(90deg,transparent 0 23px,var(--grid-2) 23px 24px)}
.row{width:100%;display:grid;grid-template-columns:minmax(160px,1.4fr) 132px 120px 90px 100px;align-items:center;gap:12px;padding:9px 16px;border:0;border-top:1px solid var(--grid-2);background:transparent;text-align:left;cursor:pointer}
.group h2 + .row{border-top:0}
.row:hover{background:var(--grid-2)}
.row .ind b{font-weight:500;display:block}
.row .ind small{color:var(--ink-3);font-size:12.5px}
.val{font-size:18px;font-weight:600;text-align:right}
.val.out{color:var(--amber)} .val.crit{color:var(--red)}
.val small{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:3px}
.delta{font-size:13px;text-align:right;color:var(--ink-2)}
.when{font-size:13px;color:var(--ink-3);text-align:right}
.detail{border-top:1px solid var(--grid-2);padding:8px 16px 16px}
.detail svg{display:block;width:100%;height:auto}
.vtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.vtable th{font-weight:500;color:var(--ink-3);text-align:left;padding:5px 8px;border-bottom:1px solid var(--grid)}
.vtable td{padding:5px 8px;border-bottom:1px solid var(--grid-2)}
.vtable .r{text-align:right}
.vtable .out{color:var(--amber);font-weight:600}.vtable .crit{color:var(--red);font-weight:600}
.vtable.board td{padding:9px 10px;vertical-align:top}
.vtable.board th{padding:9px 10px}
.linkbtn{border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:var(--blue);cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.scroll{overflow-x:auto}

/* ввод */
.card{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2)}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1px solid var(--grid);border-radius:8px;background:var(--paper);color:var(--ink);font-size:15px;width:100%}
label.f textarea{min-height:60px;resize:vertical}
.field .inwrap{display:flex;align-items:center;border:1px solid var(--grid);border-radius:8px;background:var(--paper)}
.field .inwrap:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.field .inwrap input,.field .inwrap select{border:0!important;background:transparent!important;outline:none;font-size:17px!important;font-weight:600}
.field .inwrap select{font-size:15px!important}
.field .unit{padding:0 10px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.field .hint{font-size:12.5px;color:var(--ink-3)}
.field.out .inwrap{border-color:var(--amber);background:var(--amber-soft)}
.field.out .hint{color:var(--amber)}
.field.crit .inwrap{border-color:var(--red);background:var(--red-soft)}
.field.crit .hint{color:var(--red);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--grid);background:var(--sheet);border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--ink);background:var(--blue-soft);font-weight:600}
.chip .cnt{margin-left:6px;font-size:12px;background:var(--blue);color:var(--sheet);border-radius:10px;padding:0 6px}
.preview{margin-top:4px}
.preview .ph{font-size:14px;color:var(--ink-2);margin-bottom:8px}
.formfoot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:4px}
.msg{font-size:14px}.msg.err{color:var(--red)}

.entry{background:var(--sheet);border:1px solid var(--grid);border-radius:10px;padding:11px 16px;margin-bottom:9px}
.entry .eh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.entry .eh .btn{margin-left:auto;padding:3px 10px;font-size:13px}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.vals span{background:var(--paper);border:1px solid var(--grid-2);border-radius:6px;padding:2px 8px;font-size:13.5px}
.vals span.out{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.vals span.crit{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.note{margin-top:6px;color:var(--ink-2);font-size:14px}
.entry.voided{border-style:dashed;opacity:.72}
.entry.voided .vals span{text-decoration:line-through;color:var(--ink-3);border-color:var(--grid-2);background:transparent}
.voidnote{margin-top:6px;font-size:13.5px;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:5px 10px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.scard{background:var(--sheet);border:1px solid var(--grid);border-top:3px solid var(--grid);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column}
.scard.crit{border-top-color:var(--red)}.scard.warn{border-top-color:var(--amber)}.scard.ok{border-top-color:var(--green)}
.sch{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sch h3{margin:0;font-size:16px;font-weight:600}
.scv{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.scv small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.scard.crit .scv{color:var(--red)}.scard.warn .scv{color:var(--amber)}
.scs{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.stable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.stable td{padding:4px 6px;border-top:1px solid var(--grid-2);vertical-align:top}
.stable td.r{text-align:right;width:36px}
.snote{font-size:13px;color:var(--ink-2);margin:8px 0 0}
.sca{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.stale{color:var(--amber)}
.fsec{font-weight:600;font-size:14px;color:var(--ink);border-top:1px solid var(--grid);padding-top:12px;margin-top:4px}
fieldset.sitem{border:0;border-top:1px solid var(--grid-2);margin:0;padding:10px 0}
fieldset.sitem legend{font-weight:600;font-size:14.5px;padding:0;margin-bottom:6px;float:left;width:100%}
.radios{display:flex;flex-wrap:wrap;gap:6px;clear:both}
label.rb{border:1px solid var(--grid);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px;display:flex;gap:6px;align-items:center}
label.rb:has(input:checked){background:var(--blue-soft);border-color:var(--blue);font-weight:600}
.cb{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--grid-2);font-size:14.5px;cursor:pointer}
.cb input{margin-top:3px;width:17px;height:17px;flex:none}
.cb.auto{cursor:default;color:var(--ink-2)}
.cb .pts{margin-left:auto;color:var(--ink-3);white-space:nowrap;padding-left:10px}
.autotag{font-size:12px;color:var(--blue);white-space:nowrap}
.stotal{position:sticky;bottom:0;background:var(--sheet);border-top:1px solid var(--grid);padding:10px 0;margin-top:8px;font-weight:600}
fieldset.sitem.dim{opacity:.45}
fieldset.sitem.dim legend::after{content:" — не требуется";font-weight:400;color:var(--ink-3)}
.stotal.crit{color:var(--red)}.stotal.warn{color:var(--amber)}.stotal.ok{color:var(--green)}
.empty{text-align:center;padding:56px 20px;color:var(--ink-2)}
.empty h2{color:var(--ink);font-size:20px;margin:0 0 6px}
.banner{font-size:13.5px;background:var(--blue-soft);padding:8px 20px;border-bottom:1px solid var(--grid)}
.banner.err{background:var(--red-soft)}
.alarmbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;background:var(--red-soft);color:var(--red);
  padding:8px 20px;border-bottom:2px solid var(--red)}
.alarmbar .linkbtn{color:var(--red);font-weight:600}
.alarmbar .faint{color:var(--red);opacity:.75}

dialog{border:1px solid var(--grid);border-radius:12px;padding:0;background:var(--sheet);color:var(--ink);width:min(640px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,20,35,.45)}
.dlg{padding:20px 22px}
.dlg h2{margin:0 0 14px;font-size:20px}
.dlg .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.ntable{width:100%;border-collapse:collapse;font-size:14px}
.ntable td,.ntable th{padding:5px 6px;border-bottom:1px solid var(--grid-2);text-align:left}
.ntable th{color:var(--ink-3);font-weight:500}
.ntable input{width:72px;padding:4px 6px;border:1px solid var(--grid);border-radius:6px;background:var(--paper)}
.ntable .gh td{font-weight:600;padding-top:14px;border-bottom:1px solid var(--grid)}
dialog#dlgNorms{width:min(860px,94vw)}
dialog#dlgSbar{width:min(760px,94vw)}
.sbar{white-space:pre-wrap;font-size:14.5px;background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:14px 16px;max-height:52vh;overflow:auto;max-width:80ch}

@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  aside{border-right:0}
  .app.has-patient aside{display:none}
  .app:not(.has-patient) main{display:none}
  .back{display:inline-block}
  main{padding:14px 12px 50px}
  .top{padding:10px 12px;gap:8px}
  .brand span,.mode span{display:none}
  .tabs{overflow-x:auto}
  .phead .acts{margin-left:0}
  .row{grid-template-columns:1fr auto;grid-template-areas:"ind val" "spark delta";row-gap:4px}
  .row .ind{grid-area:ind}.row .val{grid-area:val}.row .spark{grid-area:spark}.row .delta{grid-area:delta}.row .when{display:none}
  .seg button{padding:6px 9px}
}
/* в установленном приложении нет адресной строки: учитываем вырезы экрана */
@media (display-mode: standalone), (display-mode: minimal-ui), (display-mode: fullscreen){
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .app{min-height:calc(100vh - 55px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
}
@media print{.top,aside,.tabs,.toolbar,.acts,.banner,.aibar .btn{display:none!important}.app{display:block}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Интенсивное наблюдение</b><span>отклонения, шкалы и интерпретация</span></div>

function LocalStore(){

  let s = null; try { s = JSON.parse(lsGet(KEY)); } catch(e) {}
  s = s || {patients:{}, entries:{}, config:null};
  const L = {p:new Set(), e:{}, c:new Set()};
  const save = () => lsSet(KEY, JSON.stringify(s));
  const emitP = () => { const a = Object.entries(s.patients).map(([id, d]) => ({id, ...d})); L.p.forEach(f => f(a)); };
  const emitE = pid => { const a = Object.entries(s.entries[pid] || {}).map(([id, d]) => ({id, ...d})); (L.e[pid] || new Set()).forEach(f => f(a)); };
  const emitC = () => L.c.forEach(f => f(s.config));
  return {
    listenPatients(cb){ L.p.add(cb); setTimeout(emitP); return () => L.p.delete(cb); },
    listenEntries(pid, cb){ (L.e[pid] ||= new Set()).add(cb); setTimeout(() => emitE(pid)); return () => L.e[pid].delete(cb); },
    listenConfig(cb){ L.c.add(cb); setTimeout(emitC); return () => L.c.delete(cb); },
    async addPatient(d){ const id = rid(); s.patients[id] = d; save(); emitP(); return id; },
    async setPatient(id, d){ s.patients[id] = d; save(); emitP(); },
    async deletePatient(id){ delete s.patients[id]; delete s.entries[id]; save(); emitP(); },
    async getEntries(pid){ return Object.entries(s.entries[pid] || {}).map(([id, d]) => ({id, ...d})); },
    async addEntry(pid, d){ (s.entries[pid] ||= {})[rid()] = d; save(); emitE(pid); },
    async setEntry(pid, eid, d){ if (s.entries[pid]) s.entries[pid][eid] = d; save(); emitE(pid); },
    async deleteEntry(pid, eid){ if (s.entries[pid]) delete s.entries[pid][eid]; save(); emitE(pid); },
    async saveConfig(c){ s.config = c; save(); emitC(); }
  };
}
function RemoteStore(db){
  const arr = snap => snap.docs.map(d => ({id:d.id, ...d.data()}));
  return {
    listenPatients(cb, err){ return db.collection("patients").onSnapshot(s => cb(arr(s)), err); },
    listenEntries(pid, cb, err){ return db.collection(`patients/${pid}/entries`).onSnapshot(s => cb(arr(s)), err); },
    listenConfig(cb, err){ return db.doc("config/indicators").onSnapshot(s => cb(s.exists ? s.data() : null), err); },

    if (v.crea != null) { const x = v.crea; take("crea", "Креатинин", x >= 309 ? 4 : x >= 177 ? 3 : x >= 133 ? 2 : x >= 53 ? 0 : 2, fNum(x, 0)); }
    if (v.hct != null) { const x = v.hct; take("hct", "Гематокрит", x >= 60 ? 4 : x >= 50 ? 2 : x >= 46 ? 1 : x >= 30 ? 0 : x >= 20 ? 2 : 4, fNum(x, 1)); }
    if (v.wbc != null) { const x = v.wbc; take("wbc", "Лейкоциты", x >= 40 ? 4 : x >= 20 ? 2 : x >= 15 ? 1 : x >= 3 ? 0 : x >= 1 ? 2 : 4, fNum(x, 1)); }
    if (v.gcs != null) take("gcs", "Шкала Глазго (15 − ШКГ)", 15 - v.gcs, `ШКГ ${v.gcs}`);
  }
  if (!any) return null;
  const arf = p?.arf === "yes" ? true : p?.arf === "no" ? false : (akiStage(sorted, to)?.stage || 0) >= 2;
  if (rows.crea && arf) rows.crea = {...rows.crea, p:rows.crea.p * 2, src:rows.crea.src + " (×2 — ОПН)"};
  const a = ageOf(p?.birth);
  const agePts = a === "" ? 0 : a <= 44 ? 0 : a <= 54 ? 2 : a <= 64 ? 3 : a <= 74 ? 5 : 6;
  const chronic = p?.chronic === "yes" ? (p?.admType === "elective" ? 2 : 5) : 0;
  const aps = Object.values(rows).reduce((s, r) => s + r.p, 0), total = aps + agePts + chronic;
  const names = {temp:"температура", map:"АД", hr:"ЧСС", rr:"ЧДД", oxy:"оксигенация (PaO₂ и FiO₂)", ph:"pH", na:"натрий", k:"калий", crea:"креатинин", hct:"гематокрит", wbc:"лейкоциты", gcs:"ШКГ"};
  const missing = Object.keys(names).filter(k => !rows[k]).map(k => names[k]);
  if (a === "") missing.push("возраст");
  if (p?.chronic == null || p?.chronic === "") missing.push("хронические заболевания (в карточке пациента)");
  return {total, aps, agePts, age:a, chronic, rows, missing, win, arf, partial:Object.keys(rows).length < 8, mort:APACHE_MORT.find(([m]) => total <= m)[1]};
}

    const r = CRIT[c] || [];
    const dir = ((i.lo != null && x < i.lo) || (r[0] != null && x < r[0])) ? "low" : "high";
    const txt = INTERP[c]?.[dir];
    const val = `${fmtV(i, x)}${U(i)}`;
    if (crit) push("crit", `v:${c}:${dir}`, `${i.name}: ${val} — критическое значение`, (txt ? txt + " " : "") + "Подтвердить повторным измерением и немедленно сообщить врачу.");
    else if (txt) push("warn", `v:${c}:${dir}`, i.type === "sel" ? `${i.name}: ${optLabel(i, x)}` : `${i.name}: ${val} — ${dir === "low" ? "ниже" : "выше"} нормы (${refText(i)})`, txt);
    else minor.push({c, s:`${i.name} ${val}`});
  }

  /* 2. NEWS2 */
  if (news && v("vent") !== 2) {
    const note = news.miss.length ? ` Расчёт неполный: нет данных — ${news.miss.join(", ")}.` : "";
    if (news.risk === "high") push("crit", "news:high", `NEWS2 = ${news.score} — высокий клинический риск`, "Показана экстренная оценка врачом с навыками интенсивной терапии, непрерывный мониторинг, решение о переводе/эскалации." + note);
    else if (news.risk === "medium") push("warn", "news:med", `NEWS2 = ${news.score} — ${news.score >= 5 ? "средний риск" : "3 балла по одному параметру (" + news.red.join(", ") + ")"}`, "Срочный осмотр лечащим врачом, мониторинг не реже 1 раза в час." + note);
  }
  /* 3. qSOFA */
  const ment = v("avpu") != null ? v("avpu") > 0 : v("gcs") != null ? v("gcs") < 15 : null;
  const qs = [v("rr") != null && v("rr") >= 22, v("sbp") != null && v("sbp") <= 100, ment === true].filter(Boolean).length;
  if (qs >= 2) push((der._map < 65 || v("lac") >= 4) ? "crit" : "warn", "qsofa", `qSOFA ${qs}/3`, "При подозрении на инфекцию — высокий риск неблагоприятного исхода: оценить SOFA, лактат, посевы до антибиотиков, источник инфекции, инфузионную терапию.");
  /* 4. гемодинамика */
  if (der._map != null && der._map < 65) {
    if (v("lac") > 2) push("crit", "shock", `Среднее АД ${fNum(der._map, 0)} при лактате ${fNum(v("lac"), 1)} — картина шока`, "Гипотензия с гиперлактатемией: оценить тип шока (гиповолемический, распределительный, кардиогенный, обструктивный), ответ на инфузию, потребность в вазопрессорах.");
    else push("crit", "map", `Среднее АД ${fNum(der._map, 0)} мм рт. ст. (< 65)`, "Недостаточное перфузионное давление органов: оценить волемию, кровотечение, седацию, потребность в вазопрессорах; сопоставить с лактатом и диурезом.");
  }
  if (der._si != null && der._si >= 1) push(der._si >= 1.3 ? "crit" : "warn", "si", `Шоковый индекс ${fNum(der._si, 2)}`, "ЧСС превышает систолическое АД — признак скрытой гиповолемии, кровопотери или шока даже при «приемлемом» давлении.");
  /* 5. оксигенация */
  if (v("spo2") != null && v("spo2") < 92 && v("o2") === 1) push("crit", "o2fail", `SpO₂ ${v("spo2")}% несмотря на кислородотерапию`, "Нарастающая дыхательная недостаточность: газы крови, рентгенография, решение о НИВЛ/высокопоточной оксигенации/ИВЛ.");
  if (der._pf != null && der._pf < 300) {
    const grade = der._pf < 100 ? "тяжёлое" : der._pf < 200 ? "умеренное" : "лёгкое";
    push(der._pf < 100 ? "crit" : "warn", "pf", `PaO₂/FiO₂ = ${fNum(der._pf, 0)} — ${grade} нарушение оксигенации`, "Градации соответствуют Берлинским критериям ОРДС (при ПДКВ ≥ 5 см вод. ст. и двусторонних инфильтратах). Дифференцировать: пневмония, отёк лёгких, ателектаз, ТЭЛА.");
  }
  /* 6. кислотно-основное состояние */
  if (v("ph") != null) {
    const ph = v("ph"), pc = v("pco2"), hc = v("hco3"), lvl = (ph < 7.2 || ph > 7.6) ? "crit" : "warn";
    const agTxt = () => {
      if (der._ag == null) return " Для анионного интервала нужны Na, Cl и HCO₃⁻.";
      const ag = der._agc ?? der._ag, lab = der._agc != null ? "с поправкой на альбумин" : "";
      return ag > 12 ? ` Анионный интервал ${fNum(ag, 1)} ${lab} повышен: лактат, кетоацидоз, уремия, токсины (метанол, этиленгликоль, салицилаты).`
                     : ` Анионный интервал ${fNum(ag, 1)} ${lab} не повышен: потери бикарбоната (диарея, свищи), гиперхлоремия (инфузия NaCl 0,9%), канальцевый ацидоз.`;
    };
    if (ph < 7.35) {
      if (hc != null && hc < 22) {
        let comp = "";
        if (pc != null) { const exp = 1.5 * hc + 8; comp = pc > exp + 2 ? ` pCO₂ выше ожидаемого (${fNum(exp - 2, 0)}–${fNum(exp + 2, 0)} по Винтеру) — сопутствующий дыхательный ацидоз.` : pc < exp - 2 ? ` pCO₂ ниже ожидаемого (${fNum(exp - 2, 0)}–${fNum(exp + 2, 0)}) — сопутствующий дыхательный алкалоз.` : " Дыхательная компенсация адекватна."; }
        push(lvl, "ab:ma", `Метаболический ацидоз (pH ${fNum(ph, 2)}, HCO₃⁻ ${fNum(hc, 1)})`, comp.trim() + agTxt());
      } else if (pc != null && pc > 45) push(lvl, "ab:ra", `Дыхательный ацидоз (pH ${fNum(ph, 2)}, pCO₂ ${fNum(pc, 0)})`, "Гиповентиляция: угнетение дыхания (седация, опиоиды), утомление дыхательных мышц, ХОБЛ, неадекватные параметры ИВЛ.");
      else push(lvl, "ab:acid", `Ацидемия (pH ${fNum(ph, 2)})`, "Для уточнения типа нарушения нужны pCO₂ и HCO₃⁻.");
    } else if (ph > 7.45) {
      if (hc != null && hc > 26) push(lvl, "ab:malk", `Метаболический алкалоз (pH ${fNum(ph, 2)}, HCO₃⁻ ${fNum(hc, 1)})`, "Потери через зонд/рвота, диуретики, гипокалиемия, введение бикарбоната или цитрата (трансфузии).");
      else if (pc != null && pc < 35) push(lvl, "ab:ralk", `Дыхательный алкалоз (pH ${fNum(ph, 2)}, pCO₂ ${fNum(pc, 0)})`, "Гипервентиляция: гипоксемия, боль, тревога, сепсис, ТЭЛА, избыточная вентиляция на ИВЛ.");
      else push(lvl, "ab:alk", `Алкалемия (pH ${fNum(ph, 2)})`, "Для уточнения типа нарушения нужны pCO₂ и HCO₃⁻.");
    }
  }
  /* 7. почки: креатинин (KDIGO) и диурез */
  const creaS = seriesOf(sorted, "crea", T - 7 * 24 * H, T);
  if (creaS.length >= 2) {
    const last = creaS[creaS.length - 1], lt = tOf(last.t);
    const base = creaS.slice(0, -1).reduce((m, x) => x.v < m.v ? x : m);
    const in48 = creaS.filter(x => tOf(x.t) >= lt - 48 * H && x !== last);
    const min48 = in48.length ? in48.reduce((m, x) => x.v < m.v ? x : m) : null;
    const ratio = last.v / base.v, rise48 = min48 ? last.v - min48.v : 0;
    let stage = 0;
    if (ratio >= 3 || (last.v >= 354 && (ratio >= 1.5 || rise48 >= 26.5))) stage = 3; else if (ratio >= 2) stage = 2; else if (ratio >= 1.5 || rise48 >= 26.5) stage = 1;
    if (stage) {
      const from = rise48 >= 26.5 && ratio < 1.5 ? min48 : base;
      push(stage === 3 ? "crit" : "warn", "aki", `Острое повреждение почек по креатинину — KDIGO, стадия ${stage}`,
        `Креатинин ${fNum(from.v, 0)} → ${fNum(last.v, 0)} мкмоль/л за ${hoursStr(lt - tOf(from.t))}. Оценить диурез, волемию и АД, нефротоксичные препараты и контраст, исключить обструкцию; скорректировать дозы препаратов.`);
    }
  }
  /* 7a. водный баланс за 24 ч и суммарный часовой диурез */
  const fl = fluidAt(sorted, T, 24, p);
  if (fl) {
    const w = Number(p?.weight) || null;
    if (fl.nIn && fl.spanH >= 8) {
      const perKg = w ? fl.bal / w : null;
      if (fl.bal >= 2000 || (perKg != null && perKg >= 30))
        push(fl.bal >= 4000 ? "warn" : "info", "balpos", `Положительный баланс жидкости ${fNum(fl.bal, 0)} мл за ${hoursStr(fl.spanH * H)}${perKg != null ? ` (${fNum(perKg, 0)} мл/кг)` : ""}`,
          `Введено ${fNum(fl.in, 0)} мл, выведено ${fNum(fl.out, 0)} мл (диурез ${fNum(fl.urine, 0)} мл${fl.other ? `, прочие потери ${fNum(fl.other, 0)} мл` : ""}). Накопление жидкости связано с ухудшением оксигенации, отёками, внутрибрюшной гипертензией и замедленным восстановлением функции почек: оценить показания к продолжению инфузии, отёчный синдром, потребность в деэскалации объёма.`);
      else if (fl.bal <= -2000 || (perKg != null && perKg <= -30))
        push("info", "balneg", `Отрицательный баланс жидкости ${fNum(fl.bal, 0)} мл за ${hoursStr(fl.spanH * H)}`,
          `Введено ${fNum(fl.in, 0)} мл, выведено ${fNum(fl.out, 0)} мл. Сопоставить с гемодинамикой, лактатом, креатинином и массой тела: при гиповолемии возможно снижение перфузии.`);
    }
  }
  /* 7b. параметры респираторной поддержки */
  if (der._dp != null && der._dp > 14)
    push(der._dp >= 18 ? "crit" : "warn", "dp", `Движущее давление ${fNum(der._dp, 0)} см вод. ст. (Pplat ${fNum(v("pplat"), 0)}, ПДКВ ${fNum(v("peep"), 0)})`,
      "Движущее давление выше 14–15 см вод. ст. связано с более высокой летальностью при ОРДС: пересмотреть дыхательный объём, ПДКВ и растяжимость лёгких, исключить пневмоторакс, ателектаз и высокое внутрибрюшное давление.");
  else if (v("pplat") != null && v("pplat") > 30)
    push("warn", "pplat", `Давление плато ${fNum(v("pplat"), 0)} см вод. ст. (> 30)`, "Риск вентилятор-ассоциированного повреждения лёгких: оценить дыхательный объём, ПДКВ, растяжимость грудной стенки и внутрибрюшное давление.");
  if (der._vtkg != null && der._vtkg > 8)
    push("warn", "vtkg", `Дыхательный объём ${fNum(der._vtkg, 1)} мл/кг должной массы тела`, "Протективная вентиляция предполагает около 6 мл/кг должной массы тела (расчёт по росту и полу). Большие объёмы повышают риск повреждения лёгких.");
  if (der._cstat != null && der._cstat < 30)
    push(der._cstat < 20 ? "crit" : "warn", "cstat", `Статический комплаенс ${fNum(der._cstat, 1)} мл/см вод. ст.`,
      "Низкая растяжимость лёгких: ОРДС, отёк лёгких, ателектазы, пневмоторакс, плевральный выпот; также внелёгочные причины — высокое внутрибрюшное давление, ригидность грудной стенки, асинхрония. Сопоставить с движущим давлением, оценить рентген или УЗИ лёгких и подбор ПДКВ.");
  if (der._rres != null && der._rres > 10)
    push("warn", "rres", `Резистивное давление ${fNum(der._rres, 0)} см вод. ст. (Ppeak ${fNum(v("ppeak"), 0)}, Pplat ${fNum(v("pplat"), 0)})`,
      "Разница пикового давления и давления плато более 10 см вод. ст. указывает на высокое сопротивление дыхательных путей: мокрота в трубке, перегиб или прикусывание трубки, бронхоспазм, инородное тело. Санация, оценка проходимости трубки, аускультация; при бронхоспазме — обсудить бронхолитики с врачом.");
  if (der._mp != null && der._mp > 17)
    push("warn", "mp", `Механическая мощность ${fNum(der._mp, 1)} Дж/мин`,
      "Мощность выше 17 Дж/мин связана с большей частотой вентилятор-ассоциированного повреждения лёгких. Складывается из дыхательного объёма, частоты и давлений — рассмотреть снижение объёма и частоты, оптимизацию ПДКВ.");
  const diurS = seriesOf(sorted, "diur", T - 6 * H, T);
  if (diurS.length >= 2) {
    const w = Number(p?.weight) || null, lim = w ? 0.5 * w : 30;
    if (diurS.every(x => x.v < lim)) {
      const avg = diurS.reduce((a, x) => a + x.v, 0) / diurS.length;
      const spanH = (tOf(diurS[diurS.length-1].t) - tOf(diurS[0].t)) / H;
      push(w && avg < 0.3 * w && spanH >= 4 ? "crit" : "warn", "olig", `Олигурия: диурез ниже ${w ? "0,5 мл/кг/ч" : "30 мл/ч"} во всех замерах за ${hoursStr(tOf(diurS[diurS.length-1].t) - tOf(diurS[0].t))} (${diurS.length})`,
        `Средний диурез ${fNum(avg, 0)} мл/ч${w ? ` (${fNum(avg / w, 2)} мл/кг/ч)` : " — укажите массу тела пациента для точного расчёта"}. Проверить проходимость катетера, оценить волемию и перфузионное давление. Диурез < 0,5 мл/кг/ч ≥ 6 ч соответствует ОПП по KDIGO.`);
    }
  }
  /* суточный диурез по сумме часовых замеров — если олигурия по скорости уже не показана */
  if (fl && fl.nUr && fl.spanH >= 12 && !A.some(x => x.key === "olig")) {
    const perDay = fl.urine / Math.max(fl.spanH, 1) * 24;
    if (perDay < 500) push(perDay < 200 ? "crit" : "warn", "urine24", `Суммарный диурез ${fNum(fl.urine, 0)} мл за ${hoursStr(fl.spanH * H)} (около ${fNum(perDay, 0)} мл/сут)`,
      `По сумме часовых замеров диурез соответствует ${perDay < 200 ? "4 баллам" : "3 баллам"} SOFA по почкам. Проверить проходимость катетера, оценить волемию, перфузионное давление и нефротоксичные препараты.`);
  }
  /* 8. динамика крови */
  const drop = (c, hours) => {
    const s = seriesOf(sorted, c, T - hours * H, T); if (s.length < 2) return null;
    const last = s[s.length - 1], lt = tOf(last.t), prior = s.filter(x => tOf(x.t) >= lt - hours * H && x !== last);
    if (!prior.length) return null;
    const mx = prior.reduce((m, x) => x.v > m.v ? x : m), mn = prior.reduce((m, x) => x.v < m.v ? x : m), first = prior[0];
    return {last, mx, mn, first, lt};
  };
  const hbD = drop("hb", 24);
  if (hbD && hbD.mx.v - hbD.last.v >= 20) push("crit", "hbdrop", `Гемоглобин снизился на ${fNum(hbD.mx.v - hbD.last.v, 0)} г/л за ${hoursStr(hbD.lt - tOf(hbD.mx.t))}`, "Исключить кровотечение (ЖКТ, послеоперационная рана, забрюшинное, место пункции), гемолиз; частично возможна гемодилюция — сопоставить с гематокритом, ЧСС, АД и объёмом инфузии.");
  const pltD = drop("plt", 120);
  if (pltD && pltD.last.v <= 0.5 * pltD.mx.v) push("warn", "pltdrop", `Тромбоциты снизились на ${fNum(100 - pltD.last.v / pltD.mx.v * 100, 0)}% (${fNum(pltD.mx.v, 0)} → ${fNum(pltD.last.v, 0)})`, "Рассмотреть сепсис, ДВС, гепарин-индуцированную тромбоцитопению (при гепарине 5–10 дней — шкала 4T), лекарственную причину, гемодилюцию.");
  const naD = drop("na", 24);
  if (naD) { const d = Math.max(naD.mx.v - naD.last.v, naD.last.v - naD.mn.v);
    if (d >= 10) push("warn", "narate", `Натрий изменился на ${fNum(d, 0)} ммоль/л за ≤ 24 ч`, "Слишком быстрое изменение натрия опасно: при коррекции гипонатриемии — риск осмотического демиелинизирующего синдрома (не более 8–10 ммоль/л за 24 ч), при снижении гипернатриемии — отёк мозга."); }
  const kD = drop("k", 24);
  if (kD && kD.last.v - kD.mn.v >= 1 && kD.last.v > 4.5) push("warn", "krise", `Калий нарастает: ${fNum(kD.mn.v, 1)} → ${fNum(kD.last.v, 1)} ммоль/л`, "Быстрый рост калия: функция почек, препараты калия и калийсберегающие, рабдомиолиз, гемолиз, ацидоз, трансфузии.");
  const trD = drop("trop", 24);
  if (trD && trD.last.v > (im.trop.hi ?? 14) && trD.first.v > 0 && trD.last.v >= trD.first.v * 1.2) push("crit", "troprise", `Нарастание тропонина: ${fNum(trD.first.v, 0)} → ${fNum(trD.last.v, 0)} нг/л`, "Динамика тропонина характерна для острого повреждения миокарда: ЭКГ, ЭхоКГ, консультация кардиолога; у тяжёлых больных частый тип 2 (гипотензия, тахикардия, анемия, гипоксемия).");
  /* 9. коагулопатия */
  if (v("plt") != null && v("plt") < 100 && v("fib") != null && v("fib") < 1.5 && ((v("inr") ?? 0) > 1.5 || (v("aptt") ?? 0) > (im.aptt.hi ?? 37)))
    push("crit", "dic", "Сочетание тромбоцитопении, гипокоагуляции и низкого фибриногена", "Возможна коагулопатия потребления (ДВС) или массивная кровопотеря: оценить по шкале ISTH (нужны D-димеры), источник кровотечения.");

  /* 10. вазопрессоры и органная дисфункция */
  const vaso = (v("norad") || 0) > 0 || (v("adr") || 0) > 0 || (v("dopa") || 0) > 0;
  if (vaso && v("lac") > 2) push("crit", "sshock", `Вазопрессорная поддержка при лактате ${fNum(v("lac"), 1)} ммоль/л`, "При сепсисе и адекватной инфузионной нагрузке соответствует критериям септического шока (Sepsis-3). Контроль лактата каждые 2 ч, санация источника инфекции, гемодинамический мониторинг.");
  const sd = sofaDelta(sorted, T, im);
  if (sd && sd.delta >= 2) push(sd.delta >= 4 ? "crit" : "warn", "sofa", `SOFA вырос на ${sd.delta}: ${sd.base.total} → ${sd.cur.total}`, `Нарастание органной дисфункции (${sd.inc.join(", ")}). При подозрении на инфекцию ΔSOFA ≥ 2 соответствует критериям сепсиса (Sepsis-3).`);
  /* 11. оценочные шкалы и плановые оценки */
  const todo = [];
  const br = latestScale(entries, "braden");
  if (!br) todo.push("риск пролежней (Брейден)");
  else {
    if (br.score <= 12) push("warn", "braden", `Брейден ${br.score} — ${SCALES.braden.interp(br.score)[1]}`, "Противопролежневый матрас, смена положения не реже чем каждые 2 ч, ежедневный осмотр кожи (крестец, пятки, затылок, места контакта с трубками, масками и катетерами), контроль влажности кожи и питания.");
    if (Date.now() - tOf(br.at) > 24 * H) todo.push(`переоценка по Брейден (прошло ${hoursStr(Date.now() - tOf(br.at))})`);
  }
  const cam = latestScale(entries, "camicu"), rassNow = v("rass");
  if (cam && cam.score === 1 && T - tOf(cam.at) <= 24 * H) {
    const r = cam.items?.rass, subtype = r > 0 ? ", гиперактивный" : r < 0 ? ", гипоактивный" : "";
    push("warn", "delirium", `Делирий по CAM-ICU (${fDT(cam.at)}${subtype})`, "Искать причины: гипоксемия, сепсис, метаболические нарушения (глюкоза, натрий), препараты (бензодиазепины, антихолинергические), синдром отмены, боль, задержка мочи, запор. Нефармакологические меры: ориентация, сон ночью, ранняя мобилизация, очки и слуховые аппараты. Пересмотреть седацию (обычно цель RASS 0…−1).");
  }
  if (rassNow != null && rassNow >= -3 && (!cam || Date.now() - tOf(cam.at) > 12 * H)) todo.push(cam ? `скрининг делирия CAM-ICU (последний ${hoursStr(Date.now() - tOf(cam.at))} назад)` : "скрининг делирия CAM-ICU");
  const va = vteAdvice(entries);
  if (va && va.key === "vte-none") todo.push("риск ВТЭО (Caprini или Padua) и кровотечения (IMPROVE или HAS-BLED)");
  else if (va) push(va.level, va.key, va.title, va.text);
  const nu = latestScale(entries, "nutric");
  if (nu && SCALES.nutric.interp(nu.score, nu.items)[0] === "warn") push("info", "nutric-high", `Высокий нутритивный риск (${nu.items?.il6 != null && nu.items.il6 !== "" ? "NUTRIC" : "mNUTRIC"} ${nu.score})`, "Пациенты с высоким NUTRIC получают наибольшую пользу от адекватной нутритивной поддержки: раннее энтеральное питание при стабильной гемодинамике, контроль достижения целевой энергии и белка, профилактика рефидинг-синдрома (фосфор, калий, магний).");
  const nrs = latestScale(entries, "nrs"), must = latestScale(entries, "must");
  if (nrs && nrs.score >= 3)
    push("info", "nrs-high", `Нутритивный риск по NRS-2002: ${nrs.score} баллов`,
      "3 балла и выше — показана нутритивная поддержка: раннее энтеральное питание при стабильной гемодинамике, расчёт целевой энергии и белка, контроль переносимости. При длительном голодании помнить о рефидинг-синдроме (фосфор, калий, магний).");
  else if (must && must.score >= 2)
    push("info", "must-high", `Высокий риск недостаточности питания по MUST: ${must.score} балла`,
      "Высокий риск по MUST: оценить питание подробнее (NRS-2002 или NUTRIC), начать нутритивную поддержку и вести учёт фактического потребления.");
  if (!nu && !nrs && !must && p?.icuAt) todo.push("нутритивный скрининг (NUTRIC, NRS-2002 или MUST)");
  /* боль у пациента без речевого контакта */
  const cpot = latestScale(entries, "cpot");
  if (cpot && T - tOf(cpot.at) <= 12 * H && cpot.score >= 3)
    push(cpot.score >= 5 ? "crit" : "warn", "cpot", `Боль по CPOT ${cpot.score}/8 (${fDT(cpot.at)})`,
      "Более 2 баллов означает значимую боль. Оценить адекватность обезболивания, особенно перед процедурами (санация, перевязки, позиционирование); нелеченая боль усиливает возбуждение, делирий и тахикардию.");
  const bps = latestScale(entries, "bps");
  if (bps && T - tOf(bps.at) <= 12 * H && bps.score >= 6)
    push(bps.score >= 8 ? "crit" : "warn", "bps", `Боль по BPS ${bps.score}/12 (${fDT(bps.at)})`,
      "Более 5 баллов означает недостаточное обезболивание у пациента на ИВЛ. Оценить схему аналгезии и обезболивание перед процедурами (санация, перевязки, позиционирование); нелеченая боль усиливает возбуждение, делирий, асинхронию с аппаратом и тахикардию.");
  const noVerbal = v("vent") === 2 || (rassNow != null && rassNow <= -2) || (v("gcs") != null && v("gcs") < 13);
  /* боль оценивают одной из двух шкал: берём ту, что проводилась позже */
  const painSc = [cpot, bps].filter(Boolean).sort((a, b) => a.at < b.at ? 1 : -1)[0];
  if (noVerbal && (!painSc || Date.now() - tOf(painSc.at) > 12 * H)) todo.push(painSc ? `оценка боли по CPOT или BPS (последняя ${hoursStr(Date.now() - tOf(painSc.at))} назад)` : "оценка боли по CPOT или BPS — пациент не может оценить боль сам");
  /* ГИТ и ДВС: шкалы предлагаются там, где сработали соответствующие правила */
  const ft = latestScale(entries, "fourt");
  if (ft && ft.score >= 4) push(ft.score >= 6 ? "crit" : "warn", "hit", `Вероятность ГИТ по шкале 4T: ${ft.score}/8 (${fDT(ft.at)})`,
    "Средняя и высокая претестовая вероятность гепарин-индуцированной тромбоцитопении: обсудить отмену всех форм гепарина (включая промывание катетеров и гепаринизированные растворы), альтернативный антикоагулянт и иммунологическое подтверждение. Профилактика тромбоза нужна даже при низких тромбоцитах.");
  else if (!ft && A.some(a => a.key === "pltdrop")) todo.push("вероятность ГИТ по шкале 4T (тромбоциты заметно снизились)");
  const dic = latestScale(entries, "isth");
  if (dic && dic.score >= 5) push("crit", "isth", `Явный ДВС по шкале ISTH: ${dic.score}/8 (${fDT(dic.at)})`,
    "Сумма 5 баллов и выше соответствует явному ДВС: лечение основного заболевания (чаще сепсис, травма, акушерские осложнения), контроль тромбоцитов, фибриногена, МНО и D-димера в динамике, оценка источника кровотечения.");
  else if (!dic && A.some(a => a.key === "dic")) todo.push("оценка ДВС по шкале ISTH");
  const sic = latestScale(entries, "sic");
  if (sic && sic.score >= 4) push("warn", "sic", `Сепсис-индуцированная коагулопатия: SIC ${sic.score}/6 (${fDT(sic.at)})`,
    "SIC выявляет коагулопатию раньше, чем явный ДВС по ISTH: контроль тромбоцитов, МНО и фибриногена в динамике, лечение источника инфекции, оценка риска кровотечения перед инвазивными манипуляциями. При нарастании — пересчитать ISTH.");
  else if (!sic && (RX.sepsis.test(p?.dx || "") || A.some(a => a.key === "sshock")) && v("plt") != null && v("plt") < 150)
    todo.push("оценка SIC — тромбоцитопения при сепсисе");
  if (todo.length) push("info", "todo", "Плановые оценки", "Пора выполнить: " + todo.join("; ") + ".");
  const coveredMinor = c => A.some(a => a.kind === "rule" && a.covers.includes(c));
  const minorLeft = minor.filter(m => !coveredMinor(m.c));
  if (minorLeft.length) push("info", "minor", "Прочие отклонения от нормы", minorLeft.map(m => m.s).join("; ") + ".");
  const ord = {crit:0, warn:1, info:2};
  const rules = A.filter(a => a.kind === "rule");
  const kept = A.filter(a => {
    if (a.kind !== "value" || a.key === "minor") return true;
    const code = a.key.split(":")[1];
    return !rules.some(r => r.covers.includes(code) && ord[r.level] <= ord[a.level]);
  });
  kept.sort((a, b) => (ord[a.level] - ord[b.level]) || ((a.kind === "rule" ? 0 : 1) - (b.kind === "rule" ? 0 : 1)));
  const alerts = kept;
  return {alerts, st, news, der, T, qs, ment, fluid:fl, sofa:sd ? sd.cur : sofaAt(sorted, T, im), sofaD:sd};
}
function summaryOf(p, entries){
  const r = evaluate(entries, p);
  return {news:r.news ? r.news.score : null, risk:r.news ? r.news.risk : null,
    crit:r.alerts.filter(a => a.level === "crit").length, warn:r.alerts.filter(a => a.level === "warn").length,
    sofa:r.sofa ? r.sofa.total : null, vent:r.st?.vent?.v === 2, lastAt:r.T ? new Date(r.T).toISOString() : null};
}

/* ================= графики ================= */
function chartSVG(pts, ind, big){
  const W = big ? 680 : 128, Hh = big ? 240 : 36, P = big ? {l:52, r:40, t:30, b:34} : {l:3, r:3, t:4, b:4};
  const vals = pts.map(p => p.v);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (ind.lo != null) min = Math.min(min, ind.lo);
  if (ind.hi != null) max = Math.max(max, ind.hi);
  if (min === max) { min -= Math.abs(min) * .1 || 1; max += Math.abs(max) * .1 || 1; }
  const pv = (max - min) * .12; const allPos = min >= 0; min -= pv; max += pv; if (allPos && min < 0) min = 0;
  const t0 = tOf(pts[0].t), span = tOf(pts[pts.length - 1].t) - t0, pw = W - P.l - P.r, ph = Hh - P.t - P.b, ix = big ? 18 : 0;
  const X = t => span ? P.l + ix + (tOf(t) - t0) / span * (pw - 2 * ix) : P.l + pw / 2;
  const Y = v => P.t + (max - v) / (max - min) * ph;
  const col = v => (ind.code && isCrit(ind.code, v)) ? "var(--red)" : isOut(ind, v) ? "var(--amber)" : "var(--blue)";
  let o = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(ind.name)}: динамика"${big ? "" : ` width="${W}" height="${Hh}"`}>`;
  if (ind.lo != null || ind.hi != null) {
    const yT = ind.hi != null ? Y(ind.hi) : P.t, yB = ind.lo != null ? Y(ind.lo) : P.t + ph;
    o += `<rect x="${P.l}" y="${yT}" width="${pw}" height="${Math.max(0, yB - yT)}" fill="var(--band)"/>`;
    if (big) for (const y of [ind.hi != null && yT, ind.lo != null && yB]) if (y !== false) o += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--band-line)" stroke-dasharray="4 3"/>`;
  }
  if (big) {
    for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4, y = Y(v);
      o += `<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width=".6"/><text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${fNum(v, Math.min(ind.d ?? 1, 2))}</text>`; }
    const step = Math.max(1, Math.ceil(pts.length / 6));
    let lastLX = -1e9;
    pts.forEach((p, k) => { if ((k % step === 0 || k === pts.length - 1) && X(p.t) - lastLX >= 78) { lastLX = X(p.t); o += `<text x="${X(p.t)}" y="${Hh-10}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${fDT(p.t)}</text>`; } });
  }
  if (pts.length > 1) o += `<polyline fill="none" stroke="var(--blue)" stroke-width="${big ? 2 : 1.5}" stroke-linejoin="round" points="${pts.map(p => X(p.t) + "," + Y(p.v)).join(" ")}"/>`;
  pts.forEach((p, k) => {
    const c = col(p.v), last = k === pts.length - 1;
    if (!big && !last && c === "var(--blue)") return;
    o += `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="${big ? 4 : 2.6}" fill="${c}" stroke="var(--sheet)" stroke-width="1.2"/>`;
    if (big && pts.length <= 14) o += `<text x="${X(p.t)}" y="${Y(p.v)-9}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${c === "var(--blue)" ? "var(--ink)" : c}">${fmtV(ind, p.v)}</text>`;
  });
  return o + "</svg>";
}

function sumHTML(){
  const p = currentPatient();

  const r = evaluate(S.entries, p), d = r.der, n = r.news, v = c => r.st[c]?.v;
  const tiles = [];

function mdLite(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of src.split("\n")) {
    const line = raw.trim();
    if (!line) { close(); continue; }
    let m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; }
    else if ((m = line.match(/^[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close(); return html;
}

    o += scaleCard({title:"SOFA", value:`${so.total}<small>/24</small>`, level:lvl,
      sub:`Наихудшие значения за 24 ч до ${fDT(new Date(T).toISOString())}.${sd ? ` Изменение к минимуму за предыдущие 12–72 ч: ${sd.delta > 0 ? "+" : ""}${sd.delta}${sd.inc.length ? " (" + sd.inc.join(", ") + ")" : ""}.` : ""}${so.missing.length ? ` Нет данных: ${so.missing.join(", ").toLowerCase()} — считаются как 0.` : ""}`,
      body:`<table class="stable">${rows}</table><p class="snote">Для ЦНС у седатированных пациентов используют предполагаемую ШКГ до седации. ΔSOFA ≥ 2 при подозрении на инфекцию — критерий сепсиса (Sepsis-3).</p>`});
  } else o += scaleCard({title:"SOFA", value:"—", sub:"Нужны за последние 24 ч: PaO₂ и FiO₂, тромбоциты, билирубин, АД или вазопрессоры, ШКГ, креатинин или суточный диурез."});

  /* APACHE II */
  const ap = T != null ? apache2(sorted, p, im, T) : null;
  if (ap) {
    const rows = Object.values(ap.rows).map(r => `<tr><td>${esc(r.name)}</td><td class="r"><b>${r.p}</b></td><td class="muted">${esc(r.src)}</td></tr>`).join("")
      + `<tr><td>Возраст</td><td class="r"><b>${ap.agePts}</b></td><td class="muted">${ap.age !== "" ? ap.age + " " + yearsWord(ap.age) : "не указан"}</td></tr>`
      + `<tr><td>Хронические заболевания</td><td class="r"><b>${ap.chronic}</b></td><td class="muted">${p.chronic === "yes" ? (p.admType === "elective" ? "есть, плановая операция" : "есть, нехирургический или экстренная операция") : p.chronic === "no" ? "нет" : "не указано"}</td></tr>`;
    const lvl = ap.total >= 25 ? "crit" : ap.total >= 15 ? "warn" : ap.total >= 10 ? "low" : "ok";
    o += scaleCard({title:"APACHE II", value:`${ap.total}<small>/71</small>`, level:lvl,
      sub:`Период: ${esc(ap.win)}. Ориентировочная госпитальная летальность — ${ap.mort} (без поправки на диагностическую категорию).${ap.missing.length ? ` Нет данных: ${esc(ap.missing.join(", "))} — считаются нормой.` : ""}`,
      body:`<table class="stable">${rows}</table><p class="snote">Шкала предназначена для оценки при поступлении по наихудшим значениям первых 24 ч; для слежения за динамикой используйте SOFA. ОПН для удвоения креатинина: ${p.arf === "yes" ? "отмечена вручную" : p.arf === "no" ? "исключена вручную" : ap.arf ? "определена автоматически (KDIGO ≥ 2)" : "не выявлена"}.</p>`,
      actions:`<button class="btn ghost" type="button" data-act="editPatient">Время поступления и анамнез</button>`});
  } else o += scaleCard({title:"APACHE II", value:"—", sub:"Нет данных за нужный период."});

  /* RASS */
  const rs = seriesOf(sorted, "rass", T != null ? T - 24 * H : null, T), ri = im.rass;
  if (rs.length) {
    const last = rs[rs.length - 1], tgt = p.rassTarget != null && p.rassTarget !== "" ? Number(p.rassTarget) : null;
    const lvl = isCrit("rass", last.v) ? "crit" : isOut(ri, last.v) ? "warn" : "ok";
    o += scaleCard({title:"RASS", value:esc(fmtV(ri, last.v)), level:lvl,
      sub:`${esc(optLabel(ri, last.v))}, ${fDT(last.t)}. ${tgt != null ? `Целевой уровень: ${fmtV(ri, tgt)}.` : "Целевой уровень не задан (задаётся в карточке пациента)."}`,
      body:`<p class="snote">За 24 ч: ${rs.map(x => `${fDT(x.t).slice(6)} → ${fmtV(ri, x.v)}`).join(", ")}</p>`,
      actions:`<button class="btn" type="button" data-act="goRass">Внести RASS</button>`});
  } else o += scaleCard({title:"RASS", value:"—", sub:"За последние 24 ч не вносился.", actions:`<button class="btn" type="button" data-act="goRass">Внести RASS</button>`});

  /* Оценочные шкалы */
  const ctx = scaleCtx(p, S.entries);
  const ORDER = SCALE_ORDER;
  for (const key of ORDER) {
    const sc = SCALES[key], last = latestScale(S.entries, key);
    const autos = sc.kind === "check" ? sc.items.filter(it => it.auto && it.auto(ctx)).map(it => it.name) : [];
    if (last) {
      const [lvl, txt] = sc.interp(last.score, last.items);
      const age = Date.now() - tOf(last.at);
      const due = (key === "braden" && age > 24 * H) || ((key === "camicu" || key === "cpot") && age > 12 * H);
      o += scaleCard({title:sc.name, value:esc(String(scFmt(key, last.score))), level:lvl,
        sub:`${txt[0].toUpperCase() + txt.slice(1)}. Оценка ${fDT(last.at)}${last.by ? ", " + esc(last.by).replace(/\.$/, "") : ""}${due ? ` — <span class="stale">прошло ${hoursStr(age)}, нужна переоценка</span>` : ""}.`,
        body:`<p class="snote">${esc(scaleDetail(key, last, p) || "Факторы риска не отмечены")}</p><p class="snote faint">${esc(sc.note)}</p>`,
        actions:`<button class="btn" type="button" data-scale="${key}">Переоценить</button>`});
    } else {
      o += scaleCard({title:sc.name, value:"—", sub:"Не оценивалась.",
        body:`<p class="snote faint">${esc(sc.note)}</p>${autos.length ? `<p class="snote">По данным карты будут предварительно отмечены: ${esc(autos.join("; "))}.</p>` : ""}`,
        actions:`<button class="btn primary" type="button" data-scale="${key}">Оценить</button>`});
    }
  }
  o += `</div>`;
  const adv = vteAdvice(S.entries);
  if (adv && adv.key !== "vte-none") o += `<h3 class="sec">Профилактика ВТЭО</h3>` + alertHTML(adv, false);
  return o;
}

function openScaleDialog(key){
  const p = currentPatient(); if (!p) return;
  const sc = SCALES[key], last = latestScale(S.entries, key), ctx = scaleCtx(p, S.entries), f = $("#fScale");
  let items = last && sc.kind !== "cam" ? {...last.items} : {};
  let body = "", intro = sc.note;
  if (sc.kind === "sub") {
    const autos = [];
    if (!last) for (const it of sc.items) { if (!it.auto) continue; const a = it.auto(ctx); if (a != null) { items[it.id] = a; autos.push(it.name); } }
    if (autos.length) intro += " По данным карты предварительно отмечено: " + autos.join("; ").toLowerCase() + " — проверьте.";
    if (key === "isth") { const lab = [["plt","тромбоциты"],["fib","фибриноген"],["ddim","D-димер"],["inr","МНО"]]
        .map(([c, n]) => ctx.v(c) != null ? `${n} ${fNum(ctx.v(c), ctx.im[c].d)}` : null).filter(Boolean);
      intro += lab.length ? ` Последние значения: ${lab.join(", ")}. МНО выше 1,5 обычно соответствует удлинению ПВ на 3 с и более.` : " Свежих анализов свёртывания в карте нет."; }
    if (key === "fourt" && ctx.plt) intro += ` Тромбоциты: максимум за 7 сут ${fNum(ctx.plt.max, 0)}, последние ${fNum(ctx.plt.last, 0)} × 10⁹/л (снижение на ${fNum(ctx.plt.dropPct, 0)}%).`;
    body = sc.items.map(it => { const vs = subVals(it);
      return `<fieldset class="sitem"><legend>${esc(it.name)}</legend><div class="radios">${it.opts.map((o, k) =>
        `<label class="rb"><input type="radio" name="${it.id}" value="${vs[k]}" ${Number(items[it.id]) === vs[k] ? "checked" : ""}> ${vs[k]} — ${esc(o)}</label>`).join("")}</div></fieldset>`; }).join("");
  } else if (sc.kind === "check") {
    if (!last) for (const it of sc.items) if (it.auto && it.auto(ctx)) items[it.id] = true;
    const ageP = sc.ageFn ? sc.ageFn(ctx.age) : 0;
    intro += " Пункты с пометкой «по данным карты» отмечены по диагнозу, анализам, данным мониторинга и другим шкалам — проверьте их.";
    if (key === "improve") intro += ctx.gfr != null ? ` Расчётная СКФ: ${fNum(ctx.gfr, 0)} мл/мин/1,73 м².` : " СКФ не рассчитана: нужны креатинин, возраст и пол.";
    body = (sc.ageFn ? `<div class="cb auto"><span>Возраст: ${ctx.age !== "" ? ctx.age + " " + yearsWord(ctx.age) : "не указан в карточке"} <span class="autotag">рассчитано автоматически</span></span><span class="pts">+${fNum(ageP)}</span></div>` : "")
      + sc.items.map(it => { const a = it.auto && it.auto(ctx);
        return `<label class="cb"><input type="checkbox" name="${it.id}" ${it.excl ? `data-excl="${it.excl}"` : ""} ${items[it.id] ? "checked" : ""}><span>${esc(it.name)}${a ? ` <span class="autotag">по данным карты</span>` : ""}</span><span class="pts">+${fNum(it.pts)}</span></label>`; }).join("");
  } else if (sc.kind === "cam") {
    const ri = indMap(p).rass, r0 = ctx.v("rass");
    body = `<label class="f" style="margin:6px 0 4px">RASS на момент оценки<select name="c_rass">${optsHTML([["", "—"], ...ri.vals.map((v, k) => [String(v), ri.opts[k]])], r0 != null ? String(r0) : "")}</select></label>
      <fieldset class="sitem" data-step="f1"><legend>Признак 1. Острое изменение или волнообразное течение психического статуса</legend>
        <p class="snote">Отличается ли психический статус от исходного или менялся ли он за последние 24 ч (колебания RASS, ШКГ, поведения)?</p>
        <div class="radios"><label class="rb"><input type="radio" name="c_f1" value="1"> Да</label><label class="rb"><input type="radio" name="c_f1" value="0"> Нет</label></div></fieldset>
      <fieldset class="sitem" data-step="f2"><legend>Признак 2. Нарушение внимания</legend>
        <p class="snote">«Сожмите мою руку, когда услышите букву А». Произнесите 10 букв с интервалом около 3 с, среди которых 4 буквы «А» (например: С А В Е А Х А А Р Т). Ошибка — не сжал руку на «А» или сжал на другой букве.</p>
        <label class="f">Число ошибок (0–10)<input name="c_f2" inputmode="numeric" autocomplete="off"></label></fieldset>
      <fieldset class="sitem" data-step="f3"><legend>Признак 3. Изменённый уровень сознания</legend><p class="snote" id="camF3">Определяется по RASS: положителен при любом RASS, кроме 0.</p></fieldset>
      <fieldset class="sitem" data-step="f4"><legend>Признак 4. Дезорганизованное мышление</legend>
        <p class="snote">Вопросы: «Будет ли камень держаться на воде?», «Водится ли в море рыба?», «Весит ли один килограмм больше двух?», «Можно ли забить гвоздь молотком?». Команда: «Покажите столько пальцев» (покажите 2), затем «Теперь сделайте то же другой рукой». Ошибка — неверный ответ или невыполненная команда.</p>
        <label class="f">Число ошибок (0–5)<input name="c_f4" inputmode="numeric" autocomplete="off"></label></fieldset>`;
  } else if (sc.kind === "nutric") {
    const ap = ctx.sorted.length ? apache2(ctx.sorted, p, ctx.im, ctx.T) : null;
    let so = null;
    if (ctx.sorted.length) { const t0 = p.icuAt ? Math.min(tOf(p.icuAt) + 24 * H, ctx.T) : ctx.T; so = sofaAt(ctx.sorted, t0, ctx.im); }
    const days = p.hospAt && p.icuAt ? Math.max(0, (tOf(p.icuAt) - tOf(p.hospAt)) / (24 * H)) : null;
    const pre = {age:ctx.age, apache:ap ? ap.total : "", sofa:so ? so.total : "", days:days != null ? Math.round(days * 10) / 10 : ""};
    for (const k in pre) if (items[k] == null || items[k] === "") items[k] = pre[k];
    const fld = (k, label, hint, auto) => `<label class="f">${label}${auto ? ` <span class="autotag">по данным карты</span>` : ""}<input name="n_${k}" inputmode="decimal" value="${esc(items[k] ?? "")}" autocomplete="off"><span class="faint" style="font-size:12.5px">${hint}</span></label>`;
    body = `<div class="fgrid">
      ${fld("age", "Возраст, лет", "< 50 — 0; 50–74 — 1; ≥ 75 — 2", pre.age !== "")}
      ${fld("apache", "APACHE II при поступлении", "< 15 — 0; 15–19 — 1; 20–27 — 2; ≥ 28 — 3", pre.apache !== "")}
      ${fld("sofa", "SOFA при поступлении", "< 6 — 0; 6–9 — 1; ≥ 10 — 2", pre.sofa !== "")}
      ${fld("comorb", "Число сопутствующих заболеваний", "0–1 — 0; ≥ 2 — 1", false)}
      ${fld("days", "Дней от госпитализации до перевода в ОРИТ", "< 1 — 0; ≥ 1 — 1" + (pre.days === "" ? " (укажите даты поступления в карточке)" : ""), pre.days !== "")}
      ${fld("il6", "ИЛ-6, пг/мл (необязательно)", "< 400 — 0; ≥ 400 — 1", false)}
    </div>`;
  }
  f.innerHTML = `<h2>${esc(sc.name)}</h2><p class="muted" style="margin-top:0;font-size:14px">${esc(intro)}</p>
    <div class="fgrid" style="margin-bottom:10px"><label class="f">Время оценки<input type="datetime-local" name="_when" value="${nowLocal()}"></label>
      <label class="f">Кто оценивает<input name="_by" value="${esc(S.nurse)}" placeholder="ФИО"></label></div>
    ${body}
    <div class="stotal" id="sTotal"></div><span class="msg err" id="sMsg"></span>
    <div class="foot"><button class="btn ghost" value="cancel" formnovalidate>Отмена</button><button class="btn primary" type="submit" value="ok">Сохранить оценку</button></div>`;
  const numOrNull = s => { const n = parseNum(s); return n == null || Number.isNaN(n) ? null : n; };
  const collect = () => {
    const out = {};
    if (sc.kind === "sub") for (const it of sc.items) { const r = f.querySelector(`input[name="${it.id}"]:checked`); if (r) out[it.id] = Number(r.value); }
    else if (sc.kind === "check") { for (const it of sc.items) if (f.querySelector(`input[name="${it.id}"]`).checked) out[it.id] = true; }
    else if (sc.kind === "cam") {
      const r = f.c_rass.value; out.rass = r === "" ? null : Number(r);
      const f1 = f.querySelector('input[name="c_f1"]:checked'); out.f1 = f1 ? Number(f1.value) : null;
      out.f2 = numOrNull(f.c_f2.value); out.f4 = numOrNull(f.c_f4.value);
    } else if (sc.kind === "nutric") for (const k of ["age","apache","sofa","comorb","days","il6"]) { const x = numOrNull(f["n_" + k].value); out[k] = x == null ? "" : x; }
    return out;
  };
  const upd = ev => {
    if (ev && ev.target && ev.target.dataset && ev.target.dataset.excl && ev.target.checked)
      f.querySelectorAll(`input[data-excl="${ev.target.dataset.excl}"]`).forEach(x => { if (x !== ev.target) x.checked = false; });
    const it = collect(), el = $("#sTotal");
    if (sc.kind === "cam") {
      const r = camEval(it), used = {f1:it.rass != null && it.rass > -4, f2:it.f1 === 1, f3:it.f1 === 1 && it.f2 > 2, f4:it.f1 === 1 && it.f2 > 2 && it.rass === 0};
      for (const s of ["f1","f2","f3","f4"]) { const fs = f.querySelector(`[data-step="${s}"]`); fs.classList.toggle("dim", !used[s]); }
      const [lvl, txt] = r.score == null ? ["", ""] : sc.interp(r.score);
      el.className = "stotal " + (LVL_CLS[lvl] || "");
      el.textContent = r.score == null ? r.steps.join(" ") : `Результат: ${txt}. ${r.steps.join(" ")}`;
      return;
    }
    if (sc.kind === "nutric") {
      const n = nutricEval(it), [lvl, txt] = sc.interp(n.score, it);
      el.className = "stotal " + (n.complete ? LVL_CLS[lvl] || "" : "");
      el.textContent = n.complete ? `${n.mod ? "mNUTRIC" : "NUTRIC"}: ${n.score} — ${txt}` : `Заполните обязательные поля — пока ${n.score}`;
      return;
    }
    const s = scoreScale(key, it, p), [lvl, txt] = sc.interp(s, it);
    const incomplete = sc.kind === "sub" && Object.keys(it).length < sc.items.length;
    el.className = "stotal " + (incomplete ? "" : LVL_CLS[lvl] || "");
    el.textContent = incomplete ? `Заполнено ${Object.keys(it).length} из ${sc.items.length} — сумма ${s}` : `Сумма: ${scFmt(key, s)} — ${txt}`;
  };
  f.oninput = upd; f.onchange = upd; upd();
  f.onsubmit = async ev => {
    if (ev.submitter && ev.submitter.value === "cancel") return;
    ev.preventDefault();
    const it = collect(), when = f._when.value, by = f._by.value.trim(), msg = $("#sMsg");
    if (sc.kind === "sub" && Object.keys(it).length < sc.items.length) { msg.textContent = "Оцените все пункты шкалы."; return; }
    if (sc.kind === "cam") {
      if (camEval(it).score == null) { msg.textContent = "Заполните признаки по порядку до получения результата."; return; }
      if ((it.f2 != null && (it.f2 < 0 || it.f2 > 10)) || (it.f4 != null && (it.f4 < 0 || it.f4 > 5))) { msg.textContent = "Проверьте число ошибок."; return; }
    }
    if (sc.kind === "nutric" && !nutricEval(it).complete) { msg.textContent = "Заполните возраст, APACHE II, SOFA, число заболеваний и дни до ОРИТ."; return; }
    if (!when) { msg.textContent = "Укажите время оценки."; return; }
    if (!by) { msg.textContent = "Укажите, кто проводит оценку."; return; }
    const entry = {takenAt:when, values:{}, scales:{[key]:{items:it, score:scoreScale(key, it, p)}}, nurse:by, role:S.role || "", note:"", createdAt:new Date().toISOString()};
    try {
      await S.store.addEntry(p.id, entry);
      await persistSummary(p, [...S.entries, entry]);
      S.nurse = by; lsSet("icu-nurse", by); renderMeBtn();
      $("#dlgScale").close();
    } catch(e) { msg.textContent = storeErr(e); }
  };
  $("#dlgScale").showModal();
}

/* ---------- динамика ---------- */
function dynHTML(){
  const p = currentPatient();
  const periods = [["24","24 ч"],["72","72 ч"],["168","7 дней"],["all","Всё"]];
  let o = `<div class="toolbar"><div class="seg" role="group" aria-label="Период">${periods.map(([k, l]) => `<button type="button" data-period="${k}" aria-pressed="${S.period === k}">${l}</button>`).join("")}</div>
    <span class="grow"></span>${S.downloads && S.entries.length ? `<button class="btn" type="button" data-act="csv">Выгрузить CSV</button>` : ""}<button class="btn" type="button" data-act="print">Печать</button></div>`;
  if (!S.entries.length) return o + `<div class="empty"><h2>Данных пока нет</h2><button class="btn primary" data-view="add" type="button">Внести данные</button></div>`;
  const all = sortAsc(S.entries), im = indMap(p), lastT = dataT(all);
  const cut = S.period === "all" ? -Infinity : lastT - Number(S.period) * H;
  const ents = all.filter(e => tOf(e.takenAt) >= cut);
  if (!ents.length) return o + `<div class="empty"><h2>За этот период записей нет</h2></div>`;
  const series = {};
  for (const e of ents) for (const [c, v] of Object.entries(e.values || {})) (series[c] ||= []).push({t:e.takenAt, v, nurse:e.nurse});
  for (const e of ents) {
    if (!DERIVED.some(dd => dd.inputs.some(c => e.values?.[c] != null))) continue;
    const der = derive(stateAt(all, tOf(e.takenAt), im), p);
    for (const dd of DERIVED) {
      const key = dd.code === "_ag" && der._agc != null ? "_agc" : dd.code;
      if (der[key] != null && dd.inputs.some(c => e.values?.[c] != null)) (series[dd.code] ||= []).push({t:e.takenAt, v:Math.round(der[key] * 100) / 100, nurse:"расчёт"});
    }
  }
  for (const e of ents) if (SOFA_INPUTS.some(c => e.values?.[c] != null)) { const so = sofaAt(all, tOf(e.takenAt), im); if (so) (series._sofa ||= []).push({t:e.takenAt, v:so.total, nurse:"расчёт"}); }
  for (const e of ents) if (["fin","diur","lossx"].some(c => e.values?.[c] != null)) {
    const fl = fluidAt(all, tOf(e.takenAt), 24, p); if (!fl) continue;
    if (fl.nUr) (series._urine24 ||= []).push({t:e.takenAt, v:Math.round(fl.urine), nurse:"расчёт"});
    if (fl.nIn) (series._bal24 ||= []).push({t:e.takenAt, v:Math.round(fl.bal), nurse:"расчёт"});
    if (fl.insens != null) (series._insens24 ||= []).push({t:e.takenAt, v:Math.round(fl.insens), nurse:"оценка"});
    if (fl.nIn && fl.balc != null) (series._balc24 ||= []).push({t:e.takenAt, v:Math.round(fl.balc), nurse:"расчёт"});
  }
  for (const e of ents) for (const [k, x] of Object.entries(e.scales || {})) (series["_s_" + k] ||= []).push({t:e.takenAt, v:x.score, nurse:e.nurse});
  const row = ind => {
    const pts = series[ind.code], last = pts[pts.length - 1], prev = pts[pts.length - 2], open = S.open.has(ind.code);
    const cls = isCrit(ind.code, last.v) ? "crit" : isOut(ind, last.v) ? "out" : "";
    let delta = "<span class='faint'>—</span>";
    if (prev && ind.type !== "sel") { const dv = last.v - prev.v; delta = Math.abs(dv) < 1e-9 ? "без изм." : `${dv > 0 ? "↑" : "↓"} ${fNum(Math.abs(dv), ind.d)}`; }
    let h = `<button class="row" type="button" data-ind="${esc(ind.code)}" aria-expanded="${open}">
      <span class="ind"><b>${esc(ind.name)}</b><small>${ind.type === "sel" ? (ind.lo != null ? "норма " + (ind.lo === ind.hi ? fmtV(ind, ind.lo) : fmtV(ind, ind.hi) + " … " + fmtV(ind, ind.lo)) : "") : "норма " + refText(ind) + (ind.unit ? " " + esc(ind.unit) : "")}</small></span>
      <span class="spark">${chartSVG(pts, ind, false)}</span>
      <span class="val ${cls}">${fmtV(ind, last.v)}<small>${esc(ind.type === "sel" ? "" : ind.unit)}</small></span>
      <span class="delta">${delta}</span><span class="when">${fDT(last.t)}</span></button>`;
    if (open) h += `<div class="detail">${chartSVG(pts, ind, true)}<div class="scroll"><table class="vtable"><thead><tr><th>Время</th><th class="r">Значение</th><th>Внёс(ла)</th></tr></thead><tbody>
      ${pts.slice().reverse().map(x => `<tr><td>${fDTfull(x.t)}</td><td class="r ${isCrit(ind.code, x.v) ? "crit" : isOut(ind, x.v) ? "out" : ""}">${ind.type === "sel" ? esc(optLabel(ind, x.v)) : fNum(x.v, ind.d) + " " + esc(ind.unit)}</td><td>${esc(x.nurse || "—")}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    return h;
  };
  const drows = DERIVED.concat(AGG).filter(dd => series[dd.code]);
  if (drows.length) o += `<section class="group"><h2>Расчётные шкалы и индексы</h2>${drows.map(row).join("")}</section>`;
  const srows = SCALE_IND.filter(x => series[x.code]);
  if (srows.length) o += `<section class="group"><h2>Шкалы тяжести и риска</h2>${srows.map(row).join("")}</section>`;
  for (const g of GROUPS) {
    const rows = inds(p).filter(i => i.g === g.id && series[i.code]);
    if (rows.length) o += `<section class="group"><h2>${g.name}</h2>${rows.map(row).join("")}</section>`;
  }
  return o;
}

function updateFieldFlags(){

function draftValues(){

function selectPatient(id){
  if (S.unsubE) { S.unsubE(); S.unsubE = null; }
  if (S.ai.ctl) S.ai.ctl.abort();
  Object.assign(S, {selected:id, entries:[], entriesAll:[], draft:{}, draftNote:"", draftWhen:nowLocal(), newKeys:new Set(), toast:null, ai:{busy:false, text:"", ctl:null, err:""}});
  S.open.clear(); S.view = S.role === "nurse" ? "add" : "sum";
  if (S.alarm) { S.alarm = null; renderAlarm(); }
  renderSidebar(); renderMain();
  if (id) S.unsubE = S.store.listenEntries(id, list => {
    if (S.selected !== id) return;
    S.entriesAll = list; S.entries = list.filter(e => !e.void); renderTabs();
    if (S.view === "add") updatePreview(); else if (!(S.view === "sum" && S.ai.busy)) renderBody();
  }, onDbError);
}
function onDbError(e){ $("#banner").innerHTML = `<div class="banner err">Нет связи с общей базой (${esc(e && e.code)}). Обновите страницу.</div>`; }
function storeErr(e){
  if (e && e.code === "quota_exceeded") return "Хранилище заполнено: удалите записи выписанных пациентов.";
  if (e && e.code === "invalid_argument") return "Не удалось сохранить: нет прав на изменение.";
  return "Не удалось сохранить. Попробуйте ещё раз.";
}
async function persistSummary(p, entries){
  const fresh = S.patients.find(x => x.id === p.id) || p;
  S.selfSave = {pid:p.id, t:Date.now()};
  await S.store.setPatient(p.id, {...patientBody(fresh), sum:summaryOf(fresh, entries)});
}

async function submitEntry(form){
  const msg = $("#entryMsg"); msg.className = "msg err"; msg.textContent = "";
  const when = form.when.value, nurse = form.nurse.value.trim(), note = form.note.value.trim(), p = currentPatient();
  if (!p) return;
  if (!when) { msg.textContent = "Укажите время измерения."; return; }
  if (tOf(when) > Date.now() + 10 * 60e3) { msg.textContent = "Время измерения не может быть в будущем."; return; }
  if (!nurse) { msg.textContent = "Укажите, кто вносит данные."; form.nurse.focus(); return; }
  const im = indMap(p), values = {}, extreme = [];
  for (const [c, raw] of Object.entries(S.draft)) {
    const v = parseNum(raw); if (v == null) continue;
    if (Number.isNaN(v)) { msg.textContent = `«${im[c]?.name || c}»: введите число.`; return; }
    values[c] = v; const i = im[c];
    if (i && i.type !== "sel" && i.hi > 0 && (v > i.hi * 4 || (i.lo > 0 && v < i.lo / 4))) extreme.push(`${i.name}: ${fNum(v, i.d)} ${i.unit}`);
    if (c === "spo2" && v > 100 || c === "fio2" && (v < 21 || v > 100) || c === "gcs" && (v < 3 || v > 15) || c === "ph" && (v < 6.5 || v > 8)) { msg.textContent = `«${i.name}»: значение ${fNum(v, i.d)} невозможно — проверьте ввод.`; return; }
  }
  if (!Object.keys(values).length) { msg.textContent = "Заполните хотя бы один показатель."; return; }
  if (extreme.length && !confirm("Эти значения во много раз отличаются от нормы. Проверьте, нет ли ошибки ввода:\n\n" + extreme.join("\n") + "\n\nСохранить как есть?")) return;
  const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
  const entry = {takenAt:when, values, nurse, role:S.role || "", note, createdAt:new Date().toISOString()};
  const before = evaluate(S.entries, p), old = new Set(before.alerts.map(a => a.key + a.level));
  try {
    const next = [...S.entries, entry];
    await S.store.addEntry(p.id, entry);
    await persistSummary(p, next);
    S.nurse = nurse; lsSet("icu-nurse", nurse); renderMeBtn();
    const after = evaluate(next, p), fresh = after.alerts.filter(a => a.level !== "info" && !old.has(a.key + a.level));
    S.newKeys = new Set(fresh.map(a => a.key));
    const nc = fresh.filter(a => a.level === "crit").length, nw = fresh.length - nc, n = Object.keys(values).length;
    S.toast = {crit:nc > 0, text:`Сохранено: ${n} ${n === 1 ? "показатель" : n < 5 ? "показателя" : "показателей"} на ${fDT(when)}. ` +
      (fresh.length ? `Новые сигналы: ${[nc && nc + " критических", nw && nw + " требуют внимания"].filter(Boolean).join(", ")}.${nc ? " Сообщите врачу." : ""}` : "Новых тревожных сигналов нет.")};
    S.draft = {}; S.draftNote = ""; S.draftWhen = nowLocal();
    S.view = "sum"; renderTabs(); renderBody(); window.scrollTo({top:0});
  } catch(e) { msg.textContent = storeErr(e); btn.disabled = false; }
}

  const lab = ["hb","plt","wbc","crp","pct","lac","ph","k","na","crea","bil","inr","fib","ddim"].map(val).filter(Boolean);

  const sc = [];

  L.push("");

  const rec = [];
  if (crit.length) rec.push("Сообщить врачу о критических сигналах и подтвердить их повторным измерением.");
  const todo = r.alerts.find(x => x.key === "todo");
  if (todo) rec.push(todo.text);
  const vteA = r.alerts.find(x => String(x.key).startsWith("vte"));
  if (vteA) rec.push(vteA.title + ".");
  if (v("vent") === 2) rec.push("Контроль параметров ИВЛ, санация, оценка готовности к отлучению.");
  if (r.alerts.some(x => x.key === "olig" || x.key === "urine24" || x.key === "aki")) rec.push("Почасовой контроль диуреза и водного баланса.");

  if (!rec.length) rec.push("Продолжить наблюдение в прежнем объёме, контроль по графику отделения.");
  rec.forEach((x, k) => L.push(`${k + 1}. ${x}`));
  L.push("");
  L.push("Отчёт составлен автоматически по внесённым данным и не заменяет осмотр и клиническое решение.");

}

function renderNotifyBtn(){
  const b = $("#notifyBtn"); if (!b) return;
  b.textContent = S.notify ? "Уведомления: вкл" : "Уведомления: выкл";

function unlockSound(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!S.audio) S.audio = new AC();
    if (S.audio.state === "suspended") S.audio.resume();
  } catch(e) { S.audio = null; }
}
function beep(times){
  if (!S.audio) return;
  try {
    const ctx = S.audio;
    for (let k = 0; k < times; k++) {
      const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime + k * 0.42;
      o.type = "sine"; o.frequency.setValueAtTime(k % 2 ? 740 : 988, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.35);
    }
  } catch(e) {}
}
async function toggleNotify(){
  S.notify = !S.notify;
  lsSet("icu-notify", S.notify ? "1" : "0");
  if (S.notify) {
    unlockSound(); beep(1);
    try { if (window.Notification && Notification.permission === "default") await Notification.requestPermission(); } catch(e) {}
  } else { S.alarm = null; renderAlarm(); }
  renderNotifyBtn();
}
function renderAlarm(){
  const el = $("#alarm"); if (!el) return;
  if (!S.alarm) { el.innerHTML = ""; return; }
  const list = S.alarm.items.map(x => `<button class="linkbtn" type="button" data-pid="${esc(x.id)}">${esc(x.name)}</button> +${x.n}`).join(", ");
  el.innerHTML = `<div class="alarmbar" role="alert"><b>Новые критические сигналы</b><span>${list}</span><span class="grow"></span>
    <span class="faint">${fDT(S.alarm.at)}</span><button class="btn ghost" type="button" data-act="alarmClose">Закрыть</button></div>`;
}
/* сравнение со снимком списка пациентов: у кого выросло число критических сигналов */
function checkAlerts(list){
  const fired = [];
  for (const p of list) {
    if (p.discharged) { S.critSeen.delete(p.id); continue; }
    const cur = (p.sum && p.sum.crit) || 0, prev = S.critSeen.get(p.id);
    S.critSeen.set(p.id, cur);
    if (prev == null || cur <= prev) continue;
    /* не оповещаем того, кто сам только что внёс эти данные — он уже увидел сводку */
    if (S.selfSave.pid === p.id && Date.now() - S.selfSave.t < 8000) continue;
    fired.push({id:p.id, name:p.name || "Без имени", n:cur - prev});
  }
  if (!fired.length || !S.notify) return;
  S.alarm = {items:fired, at:new Date().toISOString()};
  renderAlarm(); beep(3);
  const txt = fired.map(x => `${x.name}: +${x.n}`).join("; ");
  try { if (window.Notification && Notification.permission === "granted") new Notification("Интенсивное наблюдение: новые критические сигналы", {body:txt, tag:"icu-crit"}); } catch(e) {}
}

function archiveCSV(p, entries){
  const im = indMap(p), q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Пациент","Время измерения","Показатель","Значение","Единицы","Норма","Отклонение","Внёс(ла)","Роль","Создано","Примечание","Аннулирование"].map(q).join(";")];
  const vd = e => e.void ? `${fDTfull(e.void.at)}, ${e.void.by || "—"}: ${e.void.reason}` : "";
  for (const e of sortAsc(entries)) {
    const meta = [e.nurse, e.role ? roleName(e.role) : "", e.createdAt ? fDTfull(e.createdAt) : ""];
    for (const [c, v] of Object.entries(e.values || {})) { const i = im[c] || {name:c, unit:"", lo:null, hi:null};
      lines.push([p.name, fDTfull(e.takenAt), i.name, i.type === "sel" ? optLabel(i, v) : String(v).replace(".", ","), i.unit, refText(i),
        isCrit(c, v) ? "критично" : (c !== "o2" && isOut(i, v)) ? "да" : "", ...meta, e.note, vd(e)].map(q).join(";")); }
    for (const [k, x] of Object.entries(e.scales || {})) { const sc = SCALES[k]; if (!sc) continue;
      lines.push([p.name, fDTfull(e.takenAt), sc.name, String(scFmt(k, x.score)).replace(".", ","), sc.kind === "cam" ? "" : "баллы", "",
        sc.interp(x.score, x.items)[1], ...meta, scaleDetail(k, x, p), vd(e)].map(q).join(";")); }
  }
  return "﻿" + lines.join("\r\n");
}
