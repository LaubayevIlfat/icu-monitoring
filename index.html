  const sorted = sortAsc(entries), voided = entries.filter(e => e.void).length;
  const span = entries.length ? `${fDTfull(sorted[0].takenAt)} — ${fDTfull(sorted[sorted.length - 1].takenAt)}` : "записей нет";
  el.innerHTML = `<h2>Архивировать пациента</h2>
    <p class="muted" style="margin-top:0;font-size:14px">Архивирование выгружает все записи двумя файлами — CSV для чтения и JSON со всеми полями — и затем <b>безвозвратно удаляет</b> их из общей базы вместе с карточкой. Это освобождает место: в базе не более 5 000 документов, а каждая запись занимает отдельный документ. После удаления данные останутся только в выгруженных файлах, поэтому сохраните их туда, где по порядку отделения хранится медицинская документация.</p>
    <div class="card" style="margin-bottom:14px"><div class="eh"><b>${esc(p.name)}</b><span class="muted">${esc([p.room && "палата " + p.room, p.card && "история № " + p.card].filter(Boolean).join(", "))}</span></div>
      <div class="vals"><span>Записей: <b>${entries.length}</b></span><span>Аннулированных: <b>${voided}</b></span><span>Период: <b>${esc(span)}</b></span></div></div>
    ${S.downloads ? "" : `<div class="banner err" style="margin:0 0 12px">Сохранение файлов недоступно в этом просмотре, поэтому архивировать нельзя: выгрузка обязательна.</div>`}
    ${p.discharged ? "" : `<div class="banner" style="margin:0 0 12px">Пациент не помечен как выписанный. Обычно архивируют только выписанных или переведённых.</div>`}
    <label class="f">Кто архивирует<input id="archBy" value="${esc(S.nurse)}" placeholder="ФИО"></label>
    <span class="msg err" id="archMsg"></span>
    <div class="foot"><button class="btn ghost" type="button" data-act="archClose">Отмена</button>
      <button class="btn danger" type="button" id="archGo" ${S.downloads ? "" : "disabled"}>Выгрузить и удалить</button></div>`;
  const go = $("#archGo");
  if (!go) return;
  go.onclick = async () => {
    const by = $("#archBy").value.trim(), msg = $("#archMsg");
    msg.className = "msg err";
    if (!by) { msg.textContent = "Укажите, кто архивирует пациента."; return; }
    if (!confirm(`Выгрузить и удалить все записи пациента «${p.name}» (${entries.length})? После этого данные останутся только в сохранённых файлах.`)) return;
    go.disabled = true; msg.className = "msg"; msg.textContent = "Сохраняю файлы…";
    const stamp = new Date().toISOString().slice(0, 10);
    const dump = {app:"Интенсивное наблюдение", version:"2.1.1", exportedAt:new Date().toISOString(), exportedBy:by,
      patient:patientBody(p), entries:entries.map(entryBody), config:S.config};
    try {
      await S.downloads.save({filename:`Архив — ${p.name} — ${stamp}.json`, data:JSON.stringify(dump, null, 1)});
      await S.downloads.save({filename:`Архив — ${p.name} — ${stamp}.csv`, data:archiveCSV(p, entries)});
    } catch(e) {
      msg.className = "msg err";
      msg.textContent = (e && ["unavailable","not_granted","capability_disabled"].includes(e.code))
        ? "Сохранение файлов недоступно — пациент не удалён." : "Не удалось сохранить файлы — пациент не удалён.";
      go.disabled = false; return;
    }
    msg.textContent = "Файлы сохранены, удаляю записи из базы…";
    try { await S.store.deletePatient(p.id); }
    catch(e) { msg.className = "msg err"; msg.textContent = storeErr(e) + " Файлы выгружены, данные в базе остались."; go.disabled = false; return; }
    S.nurse = by; lsSet("icu-nurse", by); renderMeBtn();
    $("#dlgArchive").close();
    if (S.selected === p.id) selectPatient(null);
  };
}

async function exportCSV(){
  const p = currentPatient(); if (!p || !S.downloads) return;
  const im = indMap(p), q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Пациент","Время","Показатель","Значение","Единицы","Норма","Отклонение","Внёс(ла)","Примечание"].map(q).join(";")];
  for (const e of sortAsc(S.entries)) for (const [c, v] of Object.entries(e.values || {})) { const i = im[c] || {name:c, unit:"", lo:null, hi:null};
    lines.push([p.name, fDTfull(e.takenAt), i.name, i.type === "sel" ? optLabel(i, v) : String(v).replace(".", ","), i.unit, refText(i), isCrit(c, v) ? "критично" : (c !== "o2" && isOut(i, v)) ? "да" : "", e.nurse, e.note].map(q).join(";")); }
  for (const e of sortAsc(S.entries)) for (const [k, x] of Object.entries(e.scales || {})) { const sc = SCALES[k]; if (sc) lines.push([p.name, fDTfull(e.takenAt), sc.name, String(scFmt(k, x.score)).replace(".", ","), sc.kind === "cam" ? "" : "баллы", "", sc.interp(x.score, x.items)[1], e.nurse, scaleDetail(k, x, p)].map(q).join(";")); }
  try { await S.downloads.save({filename:`Наблюдение — ${p.name}.csv`, data:"\uFEFF" + lines.join("\r\n")}); }
  catch(e) { if (e && ["unavailable","not_granted","capability_disabled"].includes(e.code)) { S.downloads = null; renderBody(); } }
}

/* ================= события ================= */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.dataset.pid) return selectPatient(t.dataset.pid);
  if (t.dataset.view) { if (S.view === "sum" && t.dataset.view !== "sum") { S.toast = null; S.newKeys = new Set(); } S.view = t.dataset.view; renderTabs(); return renderBody(); }
  if (t.dataset.period) { S.period = t.dataset.period; return renderBody(); }
  if (t.dataset.scale) return openScaleDialog(t.dataset.scale);
  if (t.dataset.ind) { const c = t.dataset.ind; S.open.has(c) ? S.open.delete(c) : S.open.add(c); return renderBody(); }
  if (t.dataset.dgroup) { S.draftGroup = t.dataset.dgroup; return renderBody(); }
  if (t.dataset.void) return openVoidDialog(t.dataset.void);
  switch (t.dataset.act) {
    case "back": return selectPatient(null);
    case "addPatient": return openPatientDialog(null);
    case "toggleDischarged": S.showDischarged = !S.showDischarged; renderSidebar(); return renderMain();
    case "sbar": return openSbar();
    case "editPatient": return openPatientDialog(currentPatient());
    case "clearDraft": S.draft = {}; S.draftNote = ""; S.draftWhen = nowLocal(); return renderBody();
    case "csv": return exportCSV();
    case "print": S.open = new Set(DERIVED.concat(AGG, DEFAULT_IND, SCALE_IND).map(i => i.code)); renderBody(); return setTimeout(() => window.print(), 50);
    case "aiRun": return runAI();
    case "goRass": S.view = "add"; S.draftGroup = "vitals"; renderTabs(); renderBody(); setTimeout(() => { const el = document.querySelector('[name="v_rass"]'); if (el) el.focus(); }, 30); return;
    case "aiStop": return S.ai.ctl && S.ai.ctl.abort();
    case "alarmClose": S.alarm = null; return renderAlarm();
    case "archClose": return $("#dlgArchive").close();
    case "swUpdate": swBar(""); return S.swReg && S.swReg.waiting && S.swReg.waiting.postMessage("skipWaiting");
    case "swClose": return swBar("");
  }
  if (t.dataset.arch) return openArchiveDialog(S.patients.find(p => p.id === t.dataset.arch));
});
function onDraftInput(t){
  if (t.name && t.name.startsWith("v_")) {
    S.draft[t.name.slice(2)] = t.value; updateFieldFlags();
    const chip = document.querySelector(`[data-dgroup="${S.draftGroup}"]`), all = inds(currentPatient());
    const n = all.filter(i => i.g === S.draftGroup && S.draft[i.code] != null && S.draft[i.code] !== "").length;
    if (chip) { chip.querySelector(".cnt")?.remove(); if (n) chip.insertAdjacentHTML("beforeend", `<span class="cnt">${n}</span>`); }
  }
  if (t.name === "when") S.draftWhen = t.value;
  if (t.name === "note") { S.draftNote = t.value; return; }
  if (t.name === "nurse") { S.nurse = t.value; return; }
  clearTimeout(prevTimer); prevTimer = setTimeout(updatePreview, 250);
}
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "search") { S.q = t.value; return renderSidebar(); }
  if (t.closest("#fEntry")) onDraftInput(t);
});
document.addEventListener("change", ev => { if (ev.target.tagName === "SELECT" && ev.target.closest("#fEntry")) onDraftInput(ev.target); });
document.addEventListener("submit", ev => { if (ev.target.id === "fEntry") { ev.preventDefault(); submitEntry(ev.target); } });
$("#addPatientBtn").onclick = () => openPatientDialog(null);
$("#normsBtn").onclick = openNorms;
$("#meBtn").onclick = openMe;
$("#notifyBtn").onclick = toggleNotify;
renderMeBtn(); renderNotifyBtn();

/* ================= установка как приложение (PWA) ================= */
/* Service worker делает приложение устанавливаемым и работающим без сети.
   Внутри артефакта Claude страница открыта во вложенном окне, где регистрация недоступна,
   поэтому там этот блок молча пропускается, а приложение работает как прежде. */
function swBar(html){ const el = $("#swbar"); if (el) el.innerHTML = html; }

/* приложение уже открыто в отдельном окне — предлагать установку незачем */
function standalone(){
  try { return matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches || navigator.standalone === true; }
  catch(e) { return false; }
}
/* Safari на iPhone и iPad не показывает диалог установки — там остаётся подсказка вручную */
function iosDevice(){
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
}
function renderInstallBtn(){
  const el = $("#installBtn"); if (!el) return;
  el.hidden = !(!standalone() && location.protocol.startsWith("http") && (S.installPrompt || iosDevice()));
}
function initInstall(){
  const el = $("#installBtn"); if (!el) return;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installPrompt = e; renderInstallBtn(); });
  window.addEventListener("appinstalled", () => { S.installPrompt = null; swBar(""); renderInstallBtn(); });
  el.onclick = async () => {
    const p = S.installPrompt;
    if (p) { S.installPrompt = null; renderInstallBtn(); p.prompt(); try { await p.userChoice; } catch(e) {} return; }
    swBar(`<div class="banner">Установка на iPhone и iPad: кнопка «Поделиться» в Safari → «На экран «Домой»». После этого приложение открывается в отдельном окне и работает без сети. <button class="btn ghost" type="button" data-act="swClose">Понятно</button></div>`);
  };
  renderInstallBtn();
}
function initPWA(){
  initInstall();
  /* в песочнице артефакта обращение к serviceWorker может само по себе бросить исключение */
  try {
    if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http")) return;
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloading) { reloading = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js").then(reg => {
      const offer = () => swBar(`<div class="banner">Загружена новая версия приложения. <button class="btn ghost" type="button" data-act="swUpdate">Обновить</button></div>`);
      if (reg.waiting && navigator.serviceWorker.controller) offer();
      reg.addEventListener("updatefound", () => {
        const w = reg.installing; if (!w) return;
        w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) offer(); });
      });
      S.swReg = reg;
      /* открытая сутками вкладка иначе не узнает о новой версии: проверяем при возврате к ней, не чаще раза в полчаса */
      let checked = Date.now();
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible" || Date.now() - checked < 18e5 || navigator.onLine === false) return;
        checked = Date.now(); reg.update().catch(() => {});
      });
    }).catch(() => {});
  } catch(e) {}
}
/* ярлыки установленного приложения открывают нужное окно сразу */
function applyLaunchAction(){
  let act = null;
  try { act = new URL(location.href).searchParams.get("act"); } catch(e) { return; }
  if (!act) return;
  try { history.replaceState(null, "", location.pathname + location.hash); } catch(e) {}
  if (act === "add") openPatientDialog(null);
  else if (act === "norms") openNorms();
}
function renderNet(){
  const el = $("#netbar"); if (!el) return;
  el.innerHTML = navigator.onLine === false
    ? `<div class="banner">Нет связи с сетью. Приложение продолжает работать: расчёты, шкалы и сигналы считаются на устройстве. Записи других сотрудников появятся после восстановления связи.</div>` : "";
}
window.addEventListener("online", renderNet);
window.addEventListener("offline", renderNet);

/* ================= запуск ================= */
function start(store, live){
  S.store = store;
  $("#mode").innerHTML = live ? `<i class="dot live"></i><span>Общая база отделения</span>` : `<i class="dot local"></i><span>Только этот браузер</span>`;
  if (!live) $("#banner").innerHTML = `<div class="banner">Общая база недоступна в этом просмотре — данные сохраняются только в этом браузере.</div>`;
  store.listenPatients(list => {
    S.patients = list;
    checkAlerts(list);
    if (S.selected && !list.some(p => p.id === S.selected)) return selectPatient(null);
    renderSidebar();
    if (!S.selected) return renderMain();
    renderHead();
    if (S.view === "sum" && !S.ai.busy) refreshAI();
  }, onDbError);
  store.listenConfig(cfg => { S.config = {overrides:{}, crit:{}, ...(cfg || {})}; applyCritConfig(S.config); renderSidebar(); if (S.view !== "add" && !S.ai.busy) renderBody(); }, onDbError);
}
renderMain(); renderNet(); initPWA();
(async () => {
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    const [a, b, c] = await Promise.all(["db", "downloads", "sample"].map(n => window.claude.use(n).catch(() => null)));
    db = a; S.downloads = b; S.sample = c;
  }
  start(db ? RemoteStore(db) : LocalStore(), !!db);
  applyLaunchAction();
})();
</script>
